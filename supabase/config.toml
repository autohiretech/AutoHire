project_id = "gsnoggfofbmzamxxyazc"

# Email verification is OFF — new accounts are signed in immediately, no "confirm
# your email" step. NOTE: this only affects the local CLI stack (`supabase start`)
# and `supabase config push`. The HOSTED project is controlled in the dashboard:
# Authentication → Sign In / Providers → Email → turn OFF "Confirm email".
[auth.email]
enable_confirmations = false

# The account-deletion function verifies the caller's JWT itself (with the
# service role), so the gateway's JWT check is disabled — otherwise the
# unauthenticated CORS preflight (OPTIONS) is rejected with 401 and the browser
# blocks the request. (Deployed via the dashboard under the slug 'dynamic-endpoint'.)
[functions.dynamic-endpoint]
verify_jwt = false

# Stripe payment-intent creation — verifies the caller's JWT inside the function,
# so the gateway check is off (lets the CORS preflight through).
[functions.create-payment-intent]
verify_jwt = false

# Daily FX-rate refresh — called by a scheduler (Dashboard cron / pg_cron), not a
# signed-in user, so the gateway JWT check is off. It writes with the service role.
[functions.refresh-fx-rates]
verify_jwt = false

# The AI agent verifies the caller's JWT itself (anon key + the caller's own
# Authorization header — see ai-agent/index.ts), so the gateway check is off
# here too, for the same reason as create-payment-intent above: otherwise the
# unauthenticated CORS preflight (OPTIONS) is rejected with 401.
[functions.ai-agent]
verify_jwt = false

# The payout auto-verify sweep — called by pg_cron (migration 083), not a
# signed-in user, so the gateway JWT check is off. It takes no input, answers
# with counts and no names, and its clock is inside: calling it early verifies
# nothing early.
[functions.payhold-auto-verify-payouts]
verify_jwt = false

# PayHold's server posts signed events here with no JWT — the signature IS the
# authentication (PayHold-Signature: t=…,v1=… over "t.body", verified inside the
# function against PAYHOLD_WEBHOOK_SECRET). This was only ever set by passing
# --no-verify-jwt at deploy time, so every redeploy depended on somebody
# remembering; a plain `functions deploy payhold-webhook` would have re-enabled
# the gateway check and 401'd every delivery. Declared here instead.
[functions.payhold-webhook]
verify_jwt = false
