<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- iOS launch screens. iOS reads none of the manifest for these and
         matches each `media` query exactly, so one line per device viewport;
         a PWA without them opens onto a blank white sheet. Generated by
         scripts/gen-brand.mjs — regenerate rather than edit by hand. -->
    <link rel="apple-touch-startup-image" href="/icons/splash-1320x2868.png"
          media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/icons/splash-1206x2622.png"
          media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/icons/splash-1290x2796.png"
          media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/icons/splash-1179x2556.png"
          media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/icons/splash-1170x2532.png"
          media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/icons/splash-1125x2436.png"
          media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/icons/splash-1242x2688.png"
          media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/icons/splash-828x1792.png"
          media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/icons/splash-1242x2208.png"
          media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/icons/splash-750x1334.png"
          media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- `interactive-widget=resizes-content`: when the on-screen keyboard
         opens, Chrome on Android shrinks the layout to the space above it (the
         default only shrinks the visual viewport, so bottom-pinned controls —
         the chat composer — sat behind the keyboard). iOS ignores it;
         `useVisualViewport` covers Safari. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <!-- iOS ignores the manifest entirely — these are the only way to get a
         standalone (no Safari chrome) launch and a themed status bar there. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="AutoHire" />
    <!-- Tints the phone's own browser chrome to match the app shell, so the
         status bar doesn't sit as a white band above a dark page (or vice
         versa). Two tags, one per scheme — there is no token indirection here
         because the browser reads this before any CSS loads. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d1211" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>AutoHire — Rent a car in Rwanda</title>
    <!-- Theme stamp. The token layer in index.css follows the OS by default
         and honours an explicit data-theme="light|dark" on <html> over it.
         This runs before any CSS paints so there is no flash of the wrong
         theme. A `?theme=` query wins for one load (previews, screenshots);
         otherwise a saved preference applies; otherwise nothing is stamped
         and the OS decides. -->
    <script>
      (function () {
        try {
          var q = new URLSearchParams(location.search).get('theme');
          var t = q === 'light' || q === 'dark' ? q : localStorage.getItem('autohire-theme');
          if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
